# Weekly Puzzle #34 — "The Vortox Conjecture" (Not_Quite_Vertical, r/BOTC)
# https://www.reddit.com/r/BloodOnTheClocktower/comments/1joxqgy/
# 7 players, S&V. One Demon (No Dashii or Vortox) + one Minion (Witch).
# No Outsiders. You are not evil.
# Day 1: Steph dies when nominating (Witch curse); Aoife is executed.
# Night 2: Fraser dies. Question: who is the Demon and who is the Minion?
# CONFIRMED ANSWER (author-endorsed): Sula = Vortox, Sarah = Witch. REPRODUCED
# (sound-unique; forced strict ongoing-play, vortox-malfunction counting,
# and witch-no-self-curse).
id: nqt-034
script: snv
horizon: 2
players: [sula, sarah, josh, aoife, you, fraser, steph]
statements:
  s_art: initial(aoife,nodashii)
claims:
  - {player: sula, character: clockmaker,
     info: ["shown_num(sula,clockmaker,1,3)"]}
  - {player: sarah, character: seamstress,
     info: ["uses_once(sarah,seamstress,1)",
            "picked2(sarah,seamstress,1,aoife,steph)",
            "shown_bool(sarah,seamstress,1,yes)"]}
  - {player: josh, character: juggler,
     info: ["shown_num(josh,juggler,2,0)"]}
  - {player: aoife, character: snakecharmer,
     info: ["picked(aoife,snakecharmer,1,josh)"]}
  - {player: you, character: mathematician,
     info: ["shown_num(you,mathematician,1,1)",
            "shown_num(you,mathematician,2,0)"]}
  - {player: fraser, character: sage,
     info: ["shown_pair(fraser,sage,2,josh,sarah)"]}
  - {player: steph, character: artist,
     info: ["shown_bool(steph,artist,1,yes)"]}
given:
  # day-1 public inputs
  - "juggle(josh,steph,artist,1)"
  - "juggle(josh,sula,clockmaker,1)"
  - "artist_q(s_art,steph,1)"
  - "stmt(s_art,steph,artist,1)"
  - "nominated(steph,aoife,1)"
  - "executed(aoife,1)"
  # roster
  - ":- initial(P,C), role(C,outsider,_), player(P)"
  - ":- initial(P,C), role(C,demon,_), C != nodashii, C != vortox"
  - ":- initial(P,C), role(C,minion,_), C != witch"
  - ":- align(you,evil,1)"
  # the snake charmer's pick did not transform her (claim content)
  - ":- sc_hit(aoife,Q,1), player(Q)"
  # deaths: day 1 steph (witch curse) — the death must be PRODUCED
  - ":- not day_kill(steph,1)"
  - ":- day_kill(P,1), P != steph, player(P)"
  - ":- announced_dead(P,1), player(P)"
  - ":- not announced_dead(fraser,2)"
  - ":- announced_dead(P,2), P != fraser, player(P)"
