# Day 1: You executed. Night 2: Josh dies. Day 2: Dan executed (after
# shooting Matthew — nothing happened). Night 3: Olivia dies.
# Question: who is the Demon and who is the Minion?
id: nqt-026
script: tb
horizon: 3
players: [matthew, josh, sula, fraser, you, olivia, dan, tom]
claims:
