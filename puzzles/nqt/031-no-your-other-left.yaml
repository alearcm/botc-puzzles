# Weekly Puzzle #31 — "No, Your Other Left" (Not_Quite_Vertical, r/BOTC)
# https://www.reddit.com/r/BloodOnTheClocktower/comments/1j8ub5q/
# 7 players, TB. One Imp + one minion of {Poisoner, Spy, Baron, Scarlet
# Woman}. Outsiders possible: Recluse, Drunk; default ZERO; Baron adds two.
# You are not evil, might be the Drunk. Hidden roles box: Imp, Poisoner,
# Spy, Baron, Scarlet Woman, Drunk.
# Day 1: You executed. Night 2: Tim dies. Day 2: Sarah executed.
# Night 3: Olivia dies. Question: who is the Demon and who is the Minion?
# Aoife's night-3 Empath read ("Adam + Fraser") skips Olivia, who died THAT
# night at the Imp's position before the Empath's slot — the discriminating
# instance for positional life state (deaths join the site clock).
# CONFIRMED ANSWER (author-endorsed): Adam = Imp, Sarah = Baron,
# Tim = Drunk (the Recluse registered evil to the Chef for one pair).
id: nqt-031
script: tb
horizon: 3
players: [adam, fraser, sarah, olivia, you, aoife, tim]
claims:
  - {player: adam, character: investigator,
     info: ["shown_among2(adam,investigator,1,spy,aoife,fraser)"]}
  - {player: fraser, character: recluse, info: []}
  - {player: sarah, character: undertaker,
     info: ["shown_char(sarah,undertaker,2,spy)"]}
  - {player: olivia, character: fortuneteller,
     info: ["picked2(olivia,fortuneteller,1,aoife,tim)",
            "shown_bool(olivia,fortuneteller,1,no)",
            "picked2(olivia,fortuneteller,2,aoife,olivia)",
            "shown_bool(olivia,fortuneteller,2,no)"]}
  - {player: you, character: chef,
     info: ["shown_num(you,chef,1,1)"]}
  - {player: aoife, character: empath,
     info: ["shown_num(aoife,empath,1,0)",
            "shown_num(aoife,empath,2,1)",
            "shown_num(aoife,empath,3,1)"]}
  - {player: tim, character: ravenkeeper,
     info: ["picked(tim,ravenkeeper,2,olivia)",
            "shown_char(tim,ravenkeeper,2,imp)"]}
given:
  # events
  - "executed(you,1)"
  - "executed(sarah,2)"
  - ":- announced_dead(P,1), player(P)"
  - ":- not announced_dead(tim,2)"
  - ":- announced_dead(P,2), P != tim, player(P)"
  - ":- not announced_dead(olivia,3)"
  - ":- announced_dead(P,3), P != olivia, player(P)"
  - ":- day_kill(P,D), player(P), day(D)"
  # (the empath's narrated neighbour pairs are derived by the engine from
  # seating + the death schedule + positional life state — not asserted)
  # roster
  - ":- initial(P,C), role(C,demon,_), C != imp"
  - ":- initial(P,C), role(C,minion,_), C != baron, C != spy, C != poisoner, C != scarletwoman"
  - ":- initial(P,C), role(C,outsider,_), C != recluse, C != drunk"
  # "Potential hidden roles" box: claimed role or one of these six
  - "hidden31(imp; poisoner; spy; baron; scarletwoman; drunk)"
  - ":- initial(adam,C), C != investigator, not hidden31(C)"
  - ":- initial(fraser,C), C != recluse, not hidden31(C)"
  - ":- initial(sarah,C), C != undertaker, not hidden31(C)"
  - ":- initial(olivia,C), C != fortuneteller, not hidden31(C)"
  - ":- initial(you,C), C != chef, not hidden31(C)"
  - ":- initial(aoife,C), C != empath, not hidden31(C)"
  - ":- initial(tim,C), C != ravenkeeper, not hidden31(C)"
  - ":- align(you,evil,1)"
  # first-person: you know you're the Chef (or the Drunk believing Chef)
