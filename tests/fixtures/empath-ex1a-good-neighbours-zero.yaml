  - initial(p2,soldier)
  - initial(p3,imp)
  - initial(p4,scarletwoman)
  - initial(p5,chef)
  - initial(p6,mayor)
  - initial(p7,monk)
  - shown_num(p1,empath,1,0)
assert:
  exists: true
