# Soldier almanac ex2 — "The Poisoner poisons the Soldier, then the Imp
# attacks the Soldier. The Soldier dies, since they have no ability."
# https://wiki.bloodontheclocktower.com/Soldier
id: soldier-ex2-poisoned-dies
tier: T0
source: Soldier almanac example 2 (wiki)
script: tb
horizon: 2
players: [p1, p2, p3, p4, p5, p6, p7]
given:
  - initial(p1,imp)
  - initial(p2,poisoner)
  - initial(p3,soldier)
  - initial(p4,chef)
  - initial(p5,mayor)
  - initial(p6,empath)
  - initial(p7,virgin)
  - picked(p2,poisoner,1,p2)
  - picked(p2,poisoner,2,p3)
  - picked(p1,imp,2,p3)
assert:
  certain:
    - announced_dead(p3,2)
