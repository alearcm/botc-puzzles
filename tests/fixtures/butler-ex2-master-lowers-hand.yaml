# Butler almanac ex2 — "A nomination is in progress. The Butler and their
# Master both have their hands raised to vote. As the Storyteller is counting
# votes, the Master lowers their hand at the last second. The Butler must
# lower their hand immediately."
# https://wiki.bloodontheclocktower.com/Butler
# Final tally: the master did NOT vote, so a world where the Butler's vote
# stands is illegal.
id: butler-ex2-master-lowers-hand
tier: T1
source: Butler almanac example 2 (wiki)
script: tb
horizon: 2
players: [p1, p2, p3, p4, p5, p6]
given:
  - initial(p1,imp)
  - initial(p2,scarletwoman)
  - initial(p3,butler)
  - initial(p4,chef)     # master
  - initial(p5,soldier)
  - initial(p6,mayor)
  - picked(p3,butler,1,p4)
  - voted(p3,1)
assert:
  exists: false
