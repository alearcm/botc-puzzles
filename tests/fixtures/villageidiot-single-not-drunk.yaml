# Village Idiot: "[+0 to +2 Village Idiots. 1 of the extras is drunk]" —
# with only ONE real VI in play there are no extras, so nobody is
# setup-drunk from the VI mechanic. (The 2+ case is exercised by nqt-020:
# unique world has vi_drunk on exactly one of two real VIs.)
script: tb
roster: [villageidiot]
horizon: 2
players: [p1, p2, p3, p4, p5, p6, p7]
given:
  - "initial(p1,villageidiot)"
  - "initial(p2,imp)"
  - "initial(p3,poisoner)"
  - "initial(p4,chef)"
  - "initial(p5,empath)"
  - "initial(p6,monk)"
  - "initial(p7,soldier)"
assert:
  never:
    - "vi_drunk(QQ), player(QQ)"
