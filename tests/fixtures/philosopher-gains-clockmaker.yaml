# Philosopher gains Clockmaker mid-game: learns the (true) steps token that
# night; the in-play Clockmaker is drunk from then on.
id: philosopher-gains-clockmaker
tier: T1
source: Philosopher ability text + almanac
script: snv
horizon: 2
players: [p1, p2, p3, p4, p5, p6]
given:
  - initial(p1,nodashii)
  - initial(p2,witch)
  - initial(p3,clockmaker)
  - initial(p4,sweetheart)
  - initial(p5,philosopher)
  - initial(p6,sage)
  - uses_once(p5,philosopher,2)
  - phil_pick(p5,2,clockmaker)
  - "pd :- status_on(p3,drunk,2,99)"
assert:
  certain:
    - pd
