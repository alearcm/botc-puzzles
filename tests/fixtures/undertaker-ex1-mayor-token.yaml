# Undertaker almanac ex1 — "The Mayor is executed today. That night, the
# Undertaker is shown the Mayor token."
# https://wiki.bloodontheclocktower.com/Undertaker
id: undertaker-ex1-mayor-token
tier: T0
source: Undertaker almanac example 1 (wiki)
script: tb
horizon: 2
players: [p1, p2, p3, p4, p5, p6, p7]
given:
  - initial(p1,imp)
  - initial(p2,scarletwoman)
  - initial(p3,undertaker)
  - initial(p4,mayor)
  - initial(p5,chef)
  - initial(p6,soldier)
  - initial(p7,monk)
  - executed(p4,1)
  - picked(p7,monk,2,p3)
  - picked(p1,imp,2,p5)
  - shown_char(p3,undertaker,2,mayor)
assert:
  exists: true
