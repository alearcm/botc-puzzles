# Imp self-kill: SOME minion becomes the Imp; ST may pick either minion.
id: star-pass-choice
tier: T1
source: Imp almanac (star pass)
script: tb
horizon: 3
players: [p1, p2, p3, p4, p5, p6, p7, p8, p9, p10]
given:
  - initial(p1,imp)
  - initial(p2,scarletwoman)
  - initial(p3,poisoner)
  - initial(p4,chef)
  - initial(p5,soldier)
  - initial(p6,mayor)
  - initial(p7,monk)
  - initial(p8,empath)
  - initial(p9,virgin)
  - initial(p10,slayer)
  - picked(p3,poisoner,1,p3)
  - picked(p3,poisoner,2,p3)
  - picked(p3,poisoner,3,p3)
  - picked(p1,imp,2,p1)
  - picked(p7,monk,2,p4)
  - "newimp :- char(Q,imp,3), player(Q), Q != p1"
  - ":- not newimp"
assert:
  exists: true
